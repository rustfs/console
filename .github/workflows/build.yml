# Build Next.js console and produce deploy artifacts
#
name: Build

on:
  push:
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  NODE_VERSION: "22"

jobs:
  build:
    permissions:
      contents: read
    runs-on: sm-standard-2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: pnpm ci

      - name: Build Next.js
        run: pnpm build

      - name: Zip files
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          ls -al ./out
          (
            cd ./out
            zip -r ../artifacts/rustfs-console-latest.zip .
          )
          if [ "$EVENT_NAME" = "release" ]; then
            if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == *"/"* || "$RELEASE_TAG" == *".."* ]]; then
              echo "Invalid release tag: $RELEASE_TAG" >&2
              exit 1
            fi
            mkdir -p "./artifacts/$RELEASE_TAG"
            (
              cd ./out
              zip -r "../artifacts/$RELEASE_TAG/rustfs-console-$RELEASE_TAG.zip" .
            )
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ./artifacts/rustfs-console-latest.zip

      - name: Upload publish artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: console-publish-artifacts
          path: ./artifacts
          retention-days: 1

  upload-r2:
    needs: build
    permissions: {}
    runs-on: sm-standard-2
    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: console-publish-artifacts
          path: ./artifacts

      - name: Setup AWS CLI
        shell: bash
        run: |
          set -euo pipefail

          if command -v aws >/dev/null 2>&1; then
            aws --version
            exit 0
          fi

          case "$(uname -m)" in
            x86_64) aws_arch="x86_64" ;;
            aarch64|arm64) aws_arch="aarch64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          install_dir="$RUNNER_TEMP/aws-cli"
          bin_dir="$RUNNER_TEMP/aws-bin"
          archive="$RUNNER_TEMP/awscliv2.zip"
          curl --fail --silent --show-error --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-${aws_arch}.zip" \
            --output "$archive"
          unzip -q "$archive" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/aws/install" --install-dir "$install_dir" --bin-dir "$bin_dir" --update
          echo "$bin_dir" >> "$GITHUB_PATH"
          "$bin_dir/aws" --version

      - name: Upload to Cloudflare R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_EC2_METADATA_DISABLED: true
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_ENDPOINT" || -z "$R2_BUCKET" ]]; then
            echo "⚠️ R2 credentials or endpoint missing, skipping artifact upload"
            exit 0
          fi

          if ! command -v aws >/dev/null 2>&1; then
            echo "❌ aws CLI not found on runner; cannot upload to R2"
            exit 1
          fi

          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="auto"

          R2_PATH="s3://${R2_BUCKET}/artifacts/console/"

          echo "📤 Uploading ./artifacts to $R2_PATH..."
          aws s3 cp ./artifacts "$R2_PATH" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT" \
            --only-show-errors

          echo "✅ Upload completed successfully"

  upload-release-asset:
    needs: build
    if: ${{ github.event_name == 'release' }}
    permissions:
      contents: write
    runs-on: sm-standard-2
    steps:
      - name: Download publish artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: console-publish-artifacts
          path: ./artifacts

      - name: Upload release asset `versioned`
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: artifacts/${{ github.event.release.tag_name }}/rustfs-console-${{ github.event.release.tag_name }}.zip
          fail_on_unmatched_files: true
