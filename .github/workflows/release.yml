name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string

env:
  NODE_VERSION: "22"

permissions: {}

jobs:
  # ============================================================================
  # 预发布验证
  # ============================================================================
  pre-release-validation:
    name: 🔍 Pre-Release Validation
    runs-on: sm-standard-2
    timeout-minutes: 20
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      should-deploy: ${{ steps.validation.outputs.should-deploy }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install dependencies
        run: pnpm ci

      - name: 🏷️ Extract version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          if [[ -z "$VERSION" || ! "$VERSION" =~ ^v?[0-9A-Za-z._-]+$ || "$VERSION" == *".."* ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: 🧪 Run full test suite
        run: |
          echo "## 🧪 Running Full Test Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          pnpm run test:run
          echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY

      - name: 🔍 Validate code quality
        run: |
          pnpm run lint
          pnpm run type-check 2>/dev/null || pnpm exec tsc --noEmit
          echo "✅ Code quality checks passed!" >> $GITHUB_STEP_SUMMARY

      - name: 🏗️ Test build
        run: |
          pnpm run build
          echo "✅ Build successful!" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Validation summary
        id: validation
        run: |
          echo "should-deploy=true" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Pre-release validation completed successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for release build." >> $GITHUB_STEP_SUMMARY

  # ============================================================================
  # 构建发布包
  # ============================================================================
  build-release:
    name: 🏗️ Build Release
    runs-on: sm-standard-2
    needs: pre-release-validation
    if: needs.pre-release-validation.outputs.should-deploy == 'true'
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PNPM
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          cache: true

      - name: 📦 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 📥 Install dependencies
        run: pnpm ci

      - name: 🏗️ Build for production
        env:
          RELEASE_VERSION: ${{ needs.pre-release-validation.outputs.version }}
        run: |
          pnpm run build
          echo "## 🏗️ Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Node.js**: $NODE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Build Time**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: 📦 Create zip artifacts
        env:
          RELEASE_VERSION: ${{ needs.pre-release-validation.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! -s out/index.html ]]; then
            echo "Console build is missing out/index.html" >&2
            exit 1
          fi

          mkdir -p artifacts
          (
            cd ./out
            zip -r ../artifacts/rustfs-console-latest.zip .
          )
          mkdir -p "artifacts/$RELEASE_VERSION"
          (
            cd ./out
            zip -r "../artifacts/$RELEASE_VERSION/rustfs-console-$RELEASE_VERSION.zip" .
          )

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-${{ needs.pre-release-validation.outputs.version }}
          path: |
            artifacts/*.zip
            artifacts/**/*.zip
          retention-days: 90

      - name: 📊 Build size analysis
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -d "out" ]; then
            total_size=$(du -sh out | cut -f1)
            echo "- **Total Build Size**: $total_size" >> $GITHUB_STEP_SUMMARY
            echo "- **File Breakdown**:" >> $GITHUB_STEP_SUMMARY
            find out -type f \( -name "*.js" -o -name "*.css" -o -name "*.html" \) 2>/dev/null | head -10 | while read file; do
              size=$(du -sh "$file" 2>/dev/null | cut -f1)
              echo "  - $(basename "$file"): $size" >> $GITHUB_STEP_SUMMARY
            done
          fi

  # ============================================================================
  # 创建 GitHub Release
  # ============================================================================
  create-release:
    name: 📝 Create GitHub Release
    runs-on: sm-standard-2
    needs: [pre-release-validation, build-release]
    if: needs.pre-release-validation.outputs.should-deploy == 'true' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📥 Download release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-build-${{ needs.pre-release-validation.outputs.version }}
          path: release-assets

      - name: 📝 Generate changelog
        id: changelog
        env:
          RELEASE_VERSION: ${{ needs.pre-release-validation.outputs.version }}
        run: |
          echo "## 🎉 What's New in $RELEASE_VERSION" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "### 🔄 Changes since $PREVIOUS_TAG" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
            git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG..HEAD" >> CHANGELOG.md
          else
            echo "### 🎉 Initial Release" >> CHANGELOG.md
            echo "" >> CHANGELOG.md
          fi

      - name: 🏷️ Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.pre-release-validation.outputs.version }}
          name: Release ${{ needs.pre-release-validation.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(needs.pre-release-validation.outputs.version, '-') }}
          files: release-assets/**/rustfs-console-${{ needs.pre-release-validation.outputs.version }}.zip
          fail_on_unmatched_files: true

  # ============================================================================
  # 发布后通知
  # ============================================================================
  post-release:
    name: 📢 Post-Release Notifications
    runs-on: sm-standard-2
    needs: [pre-release-validation, create-release]
    if: always() && needs.pre-release-validation.outputs.should-deploy == 'true'
    permissions: {}

    steps:
      - name: 📢 Success notification
        if: needs.create-release.result == 'success'
        env:
          RELEASE_VERSION: ${{ needs.pre-release-validation.outputs.version }}
        run: |
          echo "# 🎉 Release Successful!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 📋 Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Version**: $RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ✅ Released Successfully" >> "$GITHUB_STEP_SUMMARY"

      - name: 📢 Failure notification
        if: needs.create-release.result == 'failure'
        run: |
          echo "# ❌ Release Failed!" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Release creation failed. Please check the logs and retry." >> "$GITHUB_STEP_SUMMARY"
